apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kafka-sidecar

namespace: kafka-sidecar

resources:
  - namespace.yaml
  - configmap.yaml
  - zookeeper.yaml
  - kafka.yaml
  - fake-producer.yaml
  - fake-logic.yaml
  - fake-consumer.yaml
  - hpa.yaml
  - network-policy.yaml

# Uncomment to enable Ingress
# - ingress.yaml

commonLabels:
  app.kubernetes.io/name: kafka-sidecar
  app.kubernetes.io/version: "0.0.1"
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  project: kafka-sidecar
  environment: production

# Image tags can be overridden
images:
  - name: kafka-sidecar/fake-producer
    newTag: latest
  - name: kafka-sidecar/fake-logic
    newTag: latest
  - name: kafka-sidecar/fake-consumer
    newTag: latest

