apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-logic
  namespace: kafka-sidecar
  labels:
    app: fake-logic
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fake-logic
  template:
    metadata:
      labels:
        app: fake-logic
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: fake-logic
        image: github.com/drnow4u/kafka-sidecar/fake-logic:0.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_APPLICATION_NAME
          value: "fake-logic"
        - name: SERVER_PORT
          value: "8080"
        - name: SHIPMENT_ENDPOINT
          value: "http://fake-consumer-service:8081/api/shipments"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/orders/list
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/orders/list
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: fake-logic-service
  namespace: kafka-sidecar
  labels:
    app: fake-logic
spec:
  selector:
    app: fake-logic
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-logic
  namespace: kafka-sidecar

