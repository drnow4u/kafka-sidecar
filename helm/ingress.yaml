apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-sidecar-ingress
  namespace: kafka-sidecar
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - fake-logic.example.com
    - fake-consumer.example.com
    secretName: kafka-sidecar-tls
  rules:
  - host: fake-logic.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fake-logic-service
            port:
              number: 8080
  - host: fake-consumer.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fake-consumer-service
            port:
              number: 8081

