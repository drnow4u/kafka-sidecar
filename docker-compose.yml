version: '3.9'

services:
  # Zookeeper - Required by Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    ports:
      - "2181:2181"
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fake Producer - Generates orders every 1 second
  fake-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    image: kafka-sidecar/fake-producer:latest
    container_name: fake-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_APPLICATION_NAME: fake-producer
    ports:
      - "8080:8080"
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Kafka Sidecar - Consumes from Kafka and forwards to fake-logic
  kafka-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    image: kafka-sidecar/kafka-sidecar:latest
    container_name: kafka-sidecar
    depends_on:
      kafka:
        condition: service_healthy
      fake-logic:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_APPLICATION_NAME: kafka-sidecar
      KAFKA_ORDER_ENDPOINT: http://fake-logic:8080/api/orders
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Fake Logic - Receives orders and creates shipments
  fake-logic:
    build:
      context: .
      dockerfile: Dockerfile.logic
    image: kafka-sidecar/fake-logic:latest
    container_name: fake-logic
    environment:
      SPRING_APPLICATION_NAME: fake-logic
      SERVER_PORT: 8080
      SHIPMENT_ENDPOINT: http://fake-consumer:8081/api/shipments
    ports:
      - "8080:8080"
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/orders/list" ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Fake Consumer - Receives shipments from fake-logic
  fake-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    image: kafka-sidecar/fake-consumer:latest
    container_name: fake-consumer
    environment:
      SPRING_APPLICATION_NAME: fake-consumer
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/shipments/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  kafka-network:
    driver: bridge

